              <input type="number" class="treino-step-value" value="${set.reps}" data-action="manual" data-iid="${ex.instanceId}" data-sid="${set.id}" data-field="reps" inputmode="numeric">
              <button type="button" class="treino-step-btn" data-action="upd" data-iid="${ex.instanceId}" data-sid="${set.id}" data-field="reps" data-delta="1">+</button>
            </div>
          </div>
        </div>
      </div>`;
    }).join('') : '';

    const body = !ex.isFinished ? `<div class="treino-exercise-body">
      ${setsHtml}
      <div class="treino-exercise-actions">
        <button type="button" class="treino-btn-half treino-btn-add" data-action="add-set" data-iid="${ex.instanceId}">+ Série</button>
        <button type="button" class="treino-btn-half treino-btn-finish" data-action="toggle-ex" data-iid="${ex.instanceId}">Finalizar Exercício</button>
      </div>
    </div>` : '';

    const stats = computeExerciseStats(ex);
    let extra = '';
    if(settings.showVolume || settings.showCompare){
      const bits = [];
      if(settings.showVolume) bits.push('Vol '+stats.volume);
      if(settings.showCompare){
        const last = getLastRecord(ex.id);
        if(last){
          const dMax = stats.maxWeight - (last.maxWeight||0);
          const dVol = stats.volume - (last.volume||0);
          if(dMax>0 || dVol>0) bits.push('<span class="up">↑ vs último</span>');
          else if(dMax<0 && dVol<0) bits.push('<span class="down">↓ vs último</span>');
          else bits.push('= último');
        }else{
          bits.push('Novo');
        }
      }
      extra = `<div class="treino-card-extra">${bits.join(' · ')}</div>`;
    }
    const reorderBtns = reorderMode ? `<div class="treino-reorder-btns">
      <button type="button" data-action="move-up" data-iid="${ex.instanceId}">▲</button>
      <button type="button" data-action="move-down" data-iid="${ex.instanceId}">▼</button>
    </div>` : '';
    return `<div class="treino-exercise-card ${ex.isFinished ? 'finished' : ''}">
      <div class="treino-exercise-header">
        <div>
          <div class="treino-exercise-meta">${escapeHtml(ex.group)} · ${escapeHtml(ex.equip)}</div>
          <div class="treino-exercise-name">${index+1}. ${escapeHtml(ex.name)}${ex.isFinished ? ' ✓' : ''}</div>
          ${extra}
        </div>
        <div class="treino-header-buttons">
          ${reorderBtns}
          ${(!reorderMode && ex.isFinished) ? `<button type="button" class="treino-btn-text" data-action="toggle-ex" data-iid="${ex.instanceId}">Editar</button>` : ''}
          ${!reorderMode ? `<button type="button" class="treino-exercise-remove" data-action="remove-ex" data-iid="${ex.instanceId}">×</button>` : ''}
        </div>
      </div>
      ${reorderMode ? '' : body}
    </div>`;
  }).join('');

  // Event delegation
  container.onclick = function(e){
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.getAttribute('data-action');
    const iid = t.getAttribute('data-iid');
    const sid = t.getAttribute('data-sid');
    if(action === 'remove-ex') removeExercise(iid);
    else if(action === 'toggle-ex') toggleExerciseState(iid);
    else if(action === 'add-set') addSet(iid);
    else if(action === 'del-set') deleteSet(iid, parseInt(sid,10));
    else if(action === 'undo-set') toggleSetCompletion(iid, parseInt(sid,10));
    else if(action === 'move-up') moveExercise(iid, -1);
    else if(action === 'move-down') moveExercise(iid, 1);
    else if(action === 'upd'){
      const field = t.getAttribute('data-field');
      const delta = parseFloat(t.getAttribute('data-delta')) || 0;
      updateSet(iid, parseInt(sid,10), field, delta);
    }
  };
  container.onchange = function(e){
    const t = e.target;
    if(t.getAttribute('data-action') !== 'manual') return;
    const iid = t.getAttribute('data-iid');
    const sid = parseInt(t.getAttribute('data-sid'),10);
    const field = t.getAttribute('data-field');
    let val = parseFloat(t.value) || 0;
    const ex = activeWorkout.find(e => e.instanceId === iid);
    if(ex){
      const set = ex.sets.find(s => s.id === sid);
      if(set && !set.completed){ set[field] = Math.max(0, val); }
    }
  };
}

function addExerciseToWorkout(id){
  const exData = DB.find(ex => ex.id === id);
  if(!exData) return;
  const sets = buildPrefillSets(id);
  activeWorkout.push({
    instanceId: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    isFinished: false,
    ...exData,
    sets
  });
  closeModal();
  renderWorkout();
  const last = getLastRecord(id);
  if(last && typeof showToast === 'function'){
    showToast('Base: ' + (last.maxWeight || 0) + ' kg · ' + (last.setsCount || sets.length) + ' série(s)');
  }
}

function removeExercise(instanceId){
  activeWorkout = activeWorkout.filter(ex => ex.instanceId !== instanceId);
  renderWorkout();
}

function toggleExerciseState(instanceId){
  const ex = activeWorkout.find(e => e.instanceId === instanceId);
  if(ex){
    if(!ex.isFinished){ ex.sets.forEach(s => s.completed = true); hapticTap(); }
    ex.isFinished = !ex.isFinished;
    renderWorkout();
  }
}

function addSet(instanceId){
  const ex = activeWorkout.find(e => e.instanceId === instanceId);
  if(ex){
    const lastSet = ex.sets[ex.sets.length - 1];
    if(lastSet && settings.autoCompletePrevSet){
      const wasCompleted = !!lastSet.completed;
      lastSet.completed = true;
      if(!wasCompleted) startRestTimer();
    }
    const stepW = Number(settings.weightStep) || 1;
    ex.sets.push({
      id: ex.sets.length + 1,
      weight: lastSet ? lastSet.weight : 0,
      reps: lastSet ? lastSet.reps : 0,
      completed: false
    });
    renderWorkout();
    hapticTap();
  }
}

function deleteSet(instanceId, setId){
  const ex = activeWorkout.find(e => e.instanceId === instanceId);
  if(ex){
    ex.sets = ex.sets.filter(s => s.id !== setId);
    ex.sets.forEach((s, idx) => s.id = idx + 1);
    if(ex.sets.length === 0){
      ex.sets.push({ id: 1, weight: 0, reps: 0, completed: false });
    }
    renderWorkout();
  }
}

function updateSet(instanceId, setId, field, delta){
  const ex = activeWorkout.find(e => e.instanceId === instanceId);
  if(ex){
    const set = ex.sets.find(s => s.id === setId);
    if(set && !set.completed){
      if(field === 'weight'){
        const step = Number(settings.weightStep) || 1;
        const d = delta > 0 ? step : -step;
        set.weight = Math.max(0, Math.round(((set.weight||0) + d) * 100) / 100);
      }
      if(field === 'reps'){
        const step = Number(settings.repsStep) || 1;
        const d = delta > 0 ? step : -step;
        set.reps = Math.max(0, (set.reps||0) + d);
      }
      renderWorkout();
    }
  }
}

function toggleSetCompletion(instanceId, setId){
  const ex = activeWorkout.find(e => e.instanceId === instanceId);
  if(ex){
    const set = ex.sets.find(s => s.id === setId);
    if(set){
      const wasCompleted = !!set.completed;
      set.completed = !set.completed;
      renderWorkout();
      if(!wasCompleted && set.completed){
        hapticTap();
        startRestTimer();
      }
    }
  }
}

function processWorkoutFinish(){
  if(activeWorkout.length === 0){
    if(typeof showToast === 'function') showToast('Adicione exercícios antes de finalizar');
    else alert('Adicione exercícios antes de finalizar o treino do dia.');
    return;
  }
  if(settings.confirmFinish){
    const ok = confirm('Deseja finalizar o treino de hoje? Você só poderá iniciar um novo treino amanhã.');
    if(!ok) return;
  }
  const today = getTodayString();
  try{
    updateHistoryFromWorkout(activeWorkout, today);
    localStorage.setItem(LS_DATE, today);
    localStorage.setItem(LS_DATA, JSON.stringify(activeWorkout));
  }catch(e){
    if(typeof showToast === 'function') showToast('Erro ao salvar treino');
    return;
  }
  hapticTap();
  renderDoneScreen();
  if(typeof showToast === 'function') showToast('Treino salvo');
  if(typeof AppBackup!=='undefined') AppBackup.takeSnapshot('workout-finish');
}

function resetDayDev(){
  try{ localStorage.removeItem(LS_DATE); }catch(_){}
  init();
}

function openModal(){
  const modal = $('treinoExerciseModal');
  if(!modal) return;
  const search = $('treinoSearchBar');
  if(search) search.value = '';
  activeGroupFilter = 'Todos';
  renderChips();
  renderExerciseList();
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
}

function closeModal(){
  const modal = $('treinoExerciseModal');
  if(!modal) return;
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
}

function renderChips(){
  const container = $('treinoGroupChips');
  if(!container) return;
  container.innerHTML = GROUPS.map(g =>
    `<button type="button" class="treino-chip ${g === activeGroupFilter ? 'active' : ''}" data-group="${g}">${g}</button>`
  ).join('');
  container.onclick = function(e){
    const btn = e.target.closest('[data-group]');
    if(!btn) return;
    activeGroupFilter = btn.getAttribute('data-group');
    renderChips();
    renderExerciseList();
  };
}

function renderExerciseList(){
  const searchEl = $('treinoSearchBar');
  const query = (searchEl && searchEl.value || '').toLowerCase();
  const container = $('treinoDbList');
  if(!container) return;
  const filtered = DB.filter(ex => {
    const matchGroup = activeGroupFilter === 'Todos' || ex.group === activeGroupFilter;
    const matchSearch = ex.name.toLowerCase().includes(query) || ex.equip.toLowerCase().includes(query);
    return matchGroup && matchSearch;
  });
  if(filtered.length === 0){
    container.innerHTML = `<div style="padding:24px;text-align:center;color:rgba(255,255,255,.45)">Nenhum exercício encontrado.</div>`;
    return;
  }
  container.innerHTML = filtered.map(ex => `
    <div class="treino-list-item" data-add-id="${ex.id}">
      <div>
        <div class="treino-list-title">${escapeHtml(ex.name)}</div>
        <div class="treino-list-sub">${escapeHtml(ex.group)} · ${escapeHtml(ex.equip)}</div>
      </div>
      <div class="treino-list-add">⊕</div>
    </div>
  `).join('');
  container.onclick = function(e){
    const item = e.target.closest('[data-add-id]');
    if(!item) return;
    addExerciseToWorkout(item.getAttribute('data-add-id'));
  };
}

function bindUI(){
  const btnFinish = $('treinoBtnFinish');
  const btnAdd = $('treinoBtnAddEx');
  const modalClose = $('treinoModalClose');
  const modal = $('treinoExerciseModal');
  const search = $('treinoSearchBar');
  const settingsBtn = $('treinoSettingsBtn');
  const reorderDone = $('treinoReorderDone');
  const restSkip = $('treinoRestSkip');
  if(btnFinish) btnFinish.onclick = processWorkoutFinish;
  if(btnAdd) btnAdd.onclick = openModal;
  if(modalClose) modalClose.onclick = closeModal;
  if(restSkip) restSkip.onclick = function(){ clearRestTimer(); };
  if(modal) modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
  if(search) search.addEventListener('input', renderExerciseList);
  if(settingsBtn) settingsBtn.onclick = function(e){ e.stopPropagation(); toggleSettingsMenu(); };
  if(reorderDone) reorderDone.onclick = exitReorderMode;
  document.addEventListener('pointerdown', function(e){
    if(!settingsOpen) return;
    const menu = $('treinoSettingsMenu');
    const btn = $('treinoSettingsBtn');
    if(menu && !menu.contains(e.target) && btn && !btn.contains(e.target)) closeSettingsMenu();
  }, true);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && settings.wakeLock) requestWakeLock();
  });
}

return { init, ensureInit, bindUI, closeModal, clearRestTimer, closeSettingsMenu };
})();

/* ========== Init (garante dados sempre carregados) ========== */
async function init(){
  setupPWA();
  StorageAdapter.detect();
  try{
    await IDB.open();
    await migrateFromLegacy();
    await ContactManager.loadAll();
    AgendaUI.render();
  }catch(err){
    console.error('Init error',err);
    showToast('Armazenamento indisponível — modo limitado');
    AgendaUI.render();
  }
  if(typeof TreinoApp !== 'undefined'){
    TreinoApp.bindUI();
  }
  if(typeof AppBackup!=='undefined'){
    AppBackup.maybeRemindExport();
  }
}
init();
window.addEventListener('pagehide',()=>revokeAllObjectURLs());
})();

</script>
